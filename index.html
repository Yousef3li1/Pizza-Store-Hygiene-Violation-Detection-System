<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Store Violation Detection System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a5f3f 0%, #2d8659 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #1a5f3f;
            font-size: 1.5rem;
            border-bottom: 3px solid #1a5f3f;
            padding-bottom: 10px;
        }

        #videoContainer {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            min-height: 400px;
        }

        #videoStream {
            width: 100%;
            height: auto;
            display: block;
        }

        .status-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 8px 15px;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1a5f3f 0%, #2d8659 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card p {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .violation-card {
            background: #fee;
            color: #c00;
            border-left: 4px solid #c00;
        }

        #violationsList {
            max-height: 300px;
            overflow-y: auto;
        }

        .violation-item {
            padding: 15px;
            background: #fff5f5;
            border-left: 4px solid #ef4444;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .violation-item h4 {
            color: #dc2626;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .violation-item p {
            font-size: 0.85rem;
            color: #666;
            margin: 4px 0;
        }

        .detection-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .detection-info h3 {
            color: #1a5f3f;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .detection-badge {
            display: inline-block;
            padding: 5px 12px;
            background: #1a5f3f;
            color: white;
            border-radius: 15px;
            font-size: 0.85rem;
            margin: 5px 5px 5px 0;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: #1a5f3f;
            color: white;
        }

        .btn-primary:hover {
            background: #2d8659;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(26, 95, 63, 0.4);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #1a5f3f;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a5f3f;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 968px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .alert {
            padding: 15px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            margin-bottom: 15px;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍕 Pizza Store Violation Detection System</h1>
            <p>Real-time monitoring of scooper usage compliance</p>
        </header>

        <div class="dashboard">
            <!-- Video Stream -->
            <div class="card">
                <h2>Live Video Feed</h2>
                <div id="videoContainer">
                    <img id="videoStream" src="" alt="Video stream loading...">
                    <div class="status-indicator">
                        <div class="status-dot"></div>
                        <span>Live</span>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn btn-primary" onclick="refreshStream()">🔄 Refresh Stream</button>
                    <button class="btn btn-danger" onclick="clearViolations()">🗑️ Clear Violations</button>
                </div>
            </div>

            <!-- Statistics & Info -->
            <div>
                <div class="card" style="margin-bottom: 20px;">
                    <h2>Statistics</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <h3>Total Violations</h3>
                            <p id="totalViolations">0</p>
                        </div>
                        <div class="stat-card">
                            <h3>Active Detections</h3>
                            <p id="activeDetections">0</p>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>Current Detections</h2>
                    <div id="currentDetections" class="detection-info">
                        <div class="no-data">Waiting for detections...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Violations -->
        <div class="card">
            <h2>Recent Violations</h2>
            <div id="violationsList">
                <div class="no-data">No violations detected yet</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;  // Use same origin as webpage
        const STREAM_URL = `${API_BASE}/stream/video`;
        let ws = null;
        let reconnectInterval = null;

        // Initialize video stream
        document.getElementById('videoStream').src = STREAM_URL;

        // Connect to WebSocket
        function connectWebSocket() {
            try {
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${wsProtocol}//${window.location.host}/ws/detections`;
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    console.log('WebSocket connected');
                    clearInterval(reconnectInterval);
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'detection') {
                        updateDetections(data.data);
                    }
                };
                
                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                };
                
                ws.onclose = () => {
                    console.log('WebSocket disconnected, reconnecting...');
                    reconnectInterval = setInterval(connectWebSocket, 3000);
                };
            } catch (error) {
                console.error('Failed to connect WebSocket:', error);
                reconnectInterval = setInterval(connectWebSocket, 3000);
            }
        }

        // Update UI with detection data
        function updateDetections(data) {
            // Update total violations
            document.getElementById('totalViolations').textContent = data.total_violations || 0;
            
            // Update current detections
            const detections = data.detections || {};
            const handCount = detections.hands ? detections.hands.length : 0;
            const pizzaCount = detections.pizzas ? detections.pizzas.length : 0;
            const scooperCount = detections.scoopers ? detections.scoopers.length : 0;
            
            const totalDetections = handCount + pizzaCount + scooperCount;
            document.getElementById('activeDetections').textContent = totalDetections;
            
            // Update detection info
            const detectionsDiv = document.getElementById('currentDetections');
            if (totalDetections > 0) {
                detectionsDiv.innerHTML = `
                    <h3>Detected Objects:</h3>
                    <div>
                        ${handCount > 0 ? `<span class="detection-badge">👋 Hands: ${handCount}</span>` : ''}
                        ${pizzaCount > 0 ? `<span class="detection-badge">🍕 Pizzas: ${pizzaCount}</span>` : ''}
                        ${scooperCount > 0 ? `<span class="detection-badge">🥄 Scoopers: ${scooperCount}</span>` : ''}
                    </div>
                `;
            } else {
                detectionsDiv.innerHTML = '<div class="no-data">No objects detected</div>';
            }
            
            // Update violations list if there are new violations
            if (data.violations && data.violations.length > 0) {
                loadViolations();
            }
        }

        // Load violations from API
        async function loadViolations() {
            try {
                const response = await fetch(`${API_BASE}/api/violations/list?limit=10`);
                const data = await response.json();
                
                const violationsDiv = document.getElementById('violationsList');
                
                if (data.violations && data.violations.length > 0) {
                    violationsDiv.innerHTML = data.violations.map(v => `
                        <div class="violation-item">
                            <h4>⚠️ Violation #${v.id}</h4>
                            <p><strong>Time:</strong> ${new Date(v.timestamp).toLocaleString()}</p>
                            <p><strong>Frame:</strong> ${v.frame_number}</p>
                            <p><strong>Location:</strong> ${v.roi_name || 'Unknown ROI'}</p>
                            <p><strong>Type:</strong> ${v.violation_type}</p>
                        </div>
                    `).join('');
                } else {
                    violationsDiv.innerHTML = '<div class="no-data">No violations detected yet</div>';
                }
            } catch (error) {
                console.error('Failed to load violations:', error);
            }
        }

        // Refresh video stream
        function refreshStream() {
            const videoStream = document.getElementById('videoStream');
            videoStream.src = STREAM_URL + '?t=' + new Date().getTime();
        }

        // Clear violations
        async function clearViolations() {
            if (confirm('Are you sure you want to clear all violations?')) {
                try {
                    const response = await fetch(`${API_BASE}/api/violations/clear`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        alert('Violations cleared successfully');
                        loadViolations();
                        document.getElementById('totalViolations').textContent = '0';
                    }
                } catch (error) {
                    console.error('Failed to clear violations:', error);
                    alert('Failed to clear violations');
                }
            }
        }

        // Load statistics periodically
        async function loadStatistics() {
            try {
                const response = await fetch(`${API_BASE}/api/violations`);
                const data = await response.json();
                
                document.getElementById('totalViolations').textContent = data.total_violations || 0;
            } catch (error) {
                console.error('Failed to load statistics:', error);
            }
        }

        // Initialize
        connectWebSocket();
        loadViolations();
        loadStatistics();

        // Refresh statistics every 5 seconds (as backup to WebSocket)
        setInterval(loadStatistics, 5000);
        setInterval(loadViolations, 10000);
    </script>
</body>
</html>
